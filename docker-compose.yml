# Local and staging stack: app (php-fpm), nginx, queue worker, scheduler, PostgreSQL 16,
# Redis, ClamAV and Mailpit. Production uses managed PostgreSQL/Redis/S3 (section 10.1).
name: corvane

x-app: &app
  build: .
  image: corvane-app:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
  volumes:
    - storage:/var/www/html/storage

services:
  app:
    <<: *app

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=30", "--max-time=3600", "--memory=256"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - storage:/var/www/html/storage:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-corvane}
      POSTGRES_USER: ${DB_USERNAME:-corvane}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-corvane}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    profiles: ["dev"]
    ports: ["127.0.0.1:8025:8025"]

volumes:
  storage:
  pgdata:
  redisdata:
