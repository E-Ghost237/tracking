# Edge rate limiting complements the application limiters (FR-147, FR-148).
# Put a CDN/WAF with DDoS protection (CloudFront + AWS WAF, or Cloudflare) in front of this.
limit_req_zone $binary_remote_addr zone=perip:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 30m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 20s;
    send_timeout 30s;
    large_client_header_buffers 4 16k;

    limit_conn conn 40;
    limit_req zone=perip burst=60 nodelay;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;

    # Never serve dotfiles, VCS data or PHP files other than the front controller.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(env|log|sql|bak|ini|sh)$ { deny all; }

    location ~ ^/(login|register|forgot-password|two-factor|fr/connexion|fr/inscription|fr/mot-de-passe-oublie|fr/double-authentification) {
        limit_req zone=auth burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /storage/hero/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ { return 404; }
}
