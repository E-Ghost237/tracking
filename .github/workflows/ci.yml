# CI (section 14.2): lint, tests on PostgreSQL + Redis, dependency audit, asset build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corvane
          POSTGRES_PASSWORD: corvane
          POSTGRES_DB: corvane_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corvane" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: corvane
      DB_PASSWORD: corvane
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, redis, imagick, gd, bcmath, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install JS dependencies and build assets
        run: npm ci --no-audit --no-fund && npm run build
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          echo "FIELD_ENCRYPTION_KEY=base64:$(openssl rand -base64 32)" >> .env
      - name: Code style
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test
      - name: Dependency audit (FR-150)
        run: |
          composer audit --no-dev
          npm audit --omit=dev --audit-level=high
